name: Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:  # 允许手动运行

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install feedparser
        run: pip install feedparser
      
      - name: Aggregate RSS feeds
        run: |
          python - <<'EOF'
          import feedparser
          import xml.etree.ElementTree as ET
          from datetime import datetime
          import sys

          # Read feeds from feeds.txt
          with open('feeds.txt', 'r') as f:
              feed_urls = [line.strip() for line in f if line.strip()]

          # Create RSS feed
          rss = ET.Element('rss', version='2.0')
          channel = ET.SubElement(rss, 'channel')
          ET.SubElement(channel, 'title').text = 'Solid-State Battery Research Feed'
          ET.SubElement(channel, 'description').text = 'Aggregated RSS feed for solid-state battery research'
          ET.SubElement(channel, 'link').text = 'https://github.com'

          all_entries = []

          # Fetch and parse each feed
          for feed_url in feed_urls:
              try:
                  print(f"Fetching {feed_url}")
                  feed = feedparser.parse(feed_url)
                  for entry in feed.entries[:10]:  # Get latest 10 from each feed
                      all_entries.append(entry)
              except Exception as e:
                  print(f"Error fetching {feed_url}: {e}")

          # Sort by published date
          all_entries.sort(key=lambda x: x.get('published_parsed', (0,)*9), reverse=True)

          # Add items to RSS
          for entry in all_entries[:50]:  # Keep latest 50 items
              item = ET.SubElement(channel, 'item')
              ET.SubElement(item, 'title').text = entry.get('title', 'No title')
              ET.SubElement(item, 'link').text = entry.get('link', '')
              ET.SubElement(item, 'description').text = entry.get('summary', 'No description')
              ET.SubElement(item, 'pubDate').text = entry.get('published', '')

          # Write to file
          tree = ET.ElementTree(rss)
          ET.indent(tree, space='  ')
          tree.write('feed.xml', encoding='utf-8', xml_declaration=True)
          print("RSS feed updated successfully!")
          EOF
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update RSS feed" && git push)
```

