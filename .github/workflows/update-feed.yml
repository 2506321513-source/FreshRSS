name: Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["edge"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install feedparser
        run: pip install feedparser
      
      - name: Generate RSS
        run: |
          cat > generate_rss.py << 'ENDOFFILE'
          import feedparser
          import xml.etree.ElementTree as ET
          from datetime import datetime

          with open('feeds.txt', 'r') as f:
              feed_urls = [line.strip() for line in f if line.strip()]

          rss = ET.Element('rss', version='2.0')
          channel = ET.SubElement(rss, 'channel')
          ET.SubElement(channel, 'title').text = 'Solid-State Battery Feed'
          ET.SubElement(channel, 'description').text = 'Aggregated RSS'
          ET.SubElement(channel, 'link').text = 'https://github.com'

          all_entries = []

          for feed_url in feed_urls:
              try:
                  print(f"Fetching: {feed_url}")
                  feed = feedparser.parse(feed_url)
                  for entry in feed.entries[:10]:
                      all_entries.append(entry)
              except Exception as e:
                  print(f"Error: {e}")

          all_entries.sort(key=lambda x: x.get('published_parsed', (0,)*9), reverse=True)

          for entry in all_entries[:50]:
              item = ET.SubElement(channel, 'item')
              ET.SubElement(item, 'title').text = entry.get('title', 'No title')
              ET.SubElement(item, 'link').text = entry.get('link', '')
              desc = entry.get('summary', '')[:500]
              ET.SubElement(item, 'description').text = desc
              ET.SubElement(item, 'pubDate').text = entry.get('published', '')

          tree = ET.ElementTree(rss)
          ET.indent(tree, space='  ')
          tree.write('feed.xml', encoding='utf-8', xml_declaration=True)
          print("RSS generated!")
          ENDOFFILE
          
          python generate_rss.py
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```

