## **第六步：手动运行工作流**

1. 点击顶部 **"Actions"** 标签
2. 左侧点击 **"Deploy RSS Feed"**
3. 点击右侧 **"Run workflow"** 下拉按钮
4. 点击绿色按钮 **"Run workflow"**

