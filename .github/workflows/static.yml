name: Deploy RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:  # 允许手动运行
  push:
    branches: ["edge"]  # 当edge分支有更新时运行

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install feedparser
        run: pip install feedparser
      
      - name: Generate RSS feed
        run: |
          python3 << 'EOF'
          import feedparser
          import xml.etree.ElementTree as ET
          from datetime import datetime

          with open('feeds.txt', 'r') as f:
              feed_urls = [line.strip() for line in f if line.strip()]

          rss = ET.Element('rss', version='2.0')
          channel = ET.SubElement(rss, 'channel')
          ET.SubElement(channel, 'title').text = 'Solid-State Battery Feed'
          ET.SubElement(channel, 'description').text = 'Aggregated RSS for solid-state battery research'
          ET.SubElement(channel, 'link').text = 'https://github.com/2506321513-source/FreshRSS'

          all_entries = []

          for feed_url in feed_urls:
              try:
                  print(f"Fetching: {feed_url}")
                  feed = feedparser.parse(feed_url)
                  for entry in feed.entries[:10]:
                      all_entries.append(entry)
              except Exception as e:
                  print(f"Error: {feed_url} - {e}")

          all_entries.sort(key=lambda x: x.get('published_parsed', (0,)*9), reverse=True)

