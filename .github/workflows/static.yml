name: Deploy RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:  # 允许手动运行
  push:
    branches: ["edge"]  # 当edge分支有更新时运行

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 生成RSS feed
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install feedparser
        run: pip install feedparser
      
      - name: Generate RSS feed
        run: |
          python3 << 'EOF'
          import feedparser
          import xml.etree.ElementTree as ET
          from datetime import datetime

          # 读取feeds.txt
          with open('feeds.txt', 'r') as f:
              feed_urls = [line.strip() for line in f if line.strip()]

          # 创建RSS根元素
          rss = ET.Element('rss', version='2.0')
          channel = ET.SubElement(rss, 'channel')
          ET.SubElement(channel, 'title').text = 'Solid-State Battery Feed'
          ET.SubElement(channel, 'description').text = 'Aggregated RSS for solid-state battery research'
          ET.SubElement(channel, 'link').text = 'https://github.com/2506321513-source/FreshRSS'

          all_entries = []

          # 抓取每个RSS源
          for feed_url in feed_urls:
              try:
                  print(f"Fetching: {feed_url}")
                  feed = feedparser.parse(feed_url)
                  for entry in feed.entries[:10]:
                      all_entries.append(entry)
              except Exception as e:
                  print(f"Error: {feed_url} - {e}")

          # 按时间排序
          all_entries.sort(key=lambda x: x.get('published_parsed', (0,)*9), reverse=True)

          # 添加文章到RSS
          for entry in all_entries[:50]:
              item = ET.SubElement(channel, 'item')
              ET.SubElement(item, 'title').text = entry.get('title', 'No title')
              ET.SubElement(item, 'link').text = entry.get('link', '')
              ET.SubElement(item, 'description').text = entry.get('summary', '')[:500]
              ET.SubElement(item, 'pubDate').text = entry.get('published', '')

          # 写入文件
          tree = ET.ElementTree(rss)
          ET.indent(tree, space='  ')
          tree.write('feed.xml', encoding='utf-8', xml_declaration=True)
          print("✅ RSS feed generated!")
          EOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 部署到GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```

